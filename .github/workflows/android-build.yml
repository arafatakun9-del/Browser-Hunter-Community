name: Browser Hunter Android Build

on:
  push:
    branches:
      - main
      - "arafat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing key
        env:
          BROWSER_HUNTER_DEBUG_KEYSTORE_BASE64: ${{ secrets.BROWSER_HUNTER_DEBUG_KEYSTORE_BASE64 }}
          BROWSER_HUNTER_DEBUG_STORE_PASSWORD: ${{ secrets.BROWSER_HUNTER_DEBUG_STORE_PASSWORD }}
          BROWSER_HUNTER_DEBUG_KEY_ALIAS: ${{ secrets.BROWSER_HUNTER_DEBUG_KEY_ALIAS }}
          BROWSER_HUNTER_DEBUG_KEY_PASSWORD: ${{ secrets.BROWSER_HUNTER_DEBUG_KEY_PASSWORD }}
        run: |
          any_debug_secret=0
          for value in "$BROWSER_HUNTER_DEBUG_KEYSTORE_BASE64" "$BROWSER_HUNTER_DEBUG_STORE_PASSWORD" "$BROWSER_HUNTER_DEBUG_KEY_ALIAS" "$BROWSER_HUNTER_DEBUG_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then any_debug_secret=1; fi
          done

          if [[ "$any_debug_secret" -eq 1 ]]; then
            if [[ -z "$BROWSER_HUNTER_DEBUG_KEYSTORE_BASE64" || -z "$BROWSER_HUNTER_DEBUG_STORE_PASSWORD" || -z "$BROWSER_HUNTER_DEBUG_KEY_ALIAS" || -z "$BROWSER_HUNTER_DEBUG_KEY_PASSWORD" ]]; then
              echo "::error::Stable debug signing is partially configured. Set all four BROWSER_HUNTER_DEBUG_* secrets or remove them all."
              exit 1
            fi
            printf '%s' "$BROWSER_HUNTER_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass "$BROWSER_HUNTER_DEBUG_STORE_PASSWORD" -alias "$BROWSER_HUNTER_DEBUG_KEY_ALIAS" >/dev/null
            echo "Stable debug signing key loaded from GitHub Actions secrets."
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
            echo "::warning::No stable debug signing secrets are configured. This APK can be installed fresh, but a later build may not upgrade it without uninstalling first."
          fi

      - name: Build debug APK
        env:
          BROWSER_HUNTER_DEBUG_STORE_PASSWORD: ${{ secrets.BROWSER_HUNTER_DEBUG_STORE_PASSWORD }}
          BROWSER_HUNTER_DEBUG_KEY_ALIAS: ${{ secrets.BROWSER_HUNTER_DEBUG_KEY_ALIAS }}
          BROWSER_HUNTER_DEBUG_KEY_PASSWORD: ${{ secrets.BROWSER_HUNTER_DEBUG_KEY_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Hunter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package source ZIP
        if: success()
        run: |
          git archive --format=zip --output="Browser-Hunter-source-${GITHUB_SHA::7}.zip" HEAD

      - name: Upload source ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Hunter-source
          path: Browser-Hunter-source-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Prepare optional release signing key
        id: release-key
        env:
          BROWSER_HUNTER_RELEASE_KEYSTORE_BASE64: ${{ secrets.BROWSER_HUNTER_RELEASE_KEYSTORE_BASE64 }}
          BROWSER_HUNTER_RELEASE_STORE_PASSWORD: ${{ secrets.BROWSER_HUNTER_RELEASE_STORE_PASSWORD }}
          BROWSER_HUNTER_RELEASE_KEY_ALIAS: ${{ secrets.BROWSER_HUNTER_RELEASE_KEY_ALIAS }}
          BROWSER_HUNTER_RELEASE_KEY_PASSWORD: ${{ secrets.BROWSER_HUNTER_RELEASE_KEY_PASSWORD }}
        run: |
          any_release_secret=0
          for value in "$BROWSER_HUNTER_RELEASE_KEYSTORE_BASE64" "$BROWSER_HUNTER_RELEASE_STORE_PASSWORD" "$BROWSER_HUNTER_RELEASE_KEY_ALIAS" "$BROWSER_HUNTER_RELEASE_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then any_release_secret=1; fi
          done

          if [[ "$any_release_secret" -eq 0 ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release APK skipped: release signing secrets are not configured."
          else
            if [[ -z "$BROWSER_HUNTER_RELEASE_KEYSTORE_BASE64" || -z "$BROWSER_HUNTER_RELEASE_STORE_PASSWORD" || -z "$BROWSER_HUNTER_RELEASE_KEY_ALIAS" || -z "$BROWSER_HUNTER_RELEASE_KEY_PASSWORD" ]]; then
              echo "::error::Release signing is partially configured. Set all four BROWSER_HUNTER_RELEASE_* secrets or remove them all."
              exit 1
            fi
            printf '%s' "$BROWSER_HUNTER_RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            keytool -list -keystore release.keystore -storepass "$BROWSER_HUNTER_RELEASE_STORE_PASSWORD" -alias "$BROWSER_HUNTER_RELEASE_KEY_ALIAS" >/dev/null
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release signing key validated."
          fi

      - name: Build signed release APK
        if: steps.release-key.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.BROWSER_HUNTER_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROWSER_HUNTER_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BROWSER_HUNTER_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.release-key.outputs.available == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Hunter-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
